# CI: make check on every push and pull request; e2e suites on the wave branches.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# No live model in CI (AI-R-001, AI-011): COUNSEL_ENV=ci makes a live model config fail boot
# with live_model_forbidden, every model key is empty, and public model hosts resolve to
# 0.0.0.0. tools/no_live_model_test.go checks all three.
env:
  COUNSEL_ENV: ci
  ANTHROPIC_API_KEY: ""
  ANTHROPIC_AUTH_TOKEN: ""
  CLAUDE_CODE_OAUTH_TOKEN: ""
  OPENAI_API_KEY: ""
  AZURE_OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  MISTRAL_API_KEY: ""
  COHERE_API_KEY: ""
  GROQ_API_KEY: ""
  TOGETHER_API_KEY: ""
  XAI_API_KEY: ""
  MODEL_HOSTS: >-
    api.anthropic.com api.openai.com generativelanguage.googleapis.com
    aiplatform.googleapis.com api.mistral.ai api.cohere.ai api.cohere.com
    openai.azure.com bedrock-runtime.amazonaws.com api.groq.com api.together.xyz api.x.ai

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Block egress to public model hosts
        run: for h in $MODEL_HOSTS; do echo "0.0.0.0 $h" | sudo tee -a /etc/hosts >/dev/null; done
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit tests need no network and no Docker. Integration tests carry
      # //go:build integration and read COUNSEL_TEST_DB, so make check skips them.
      - run: make check

  integration:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/wave/')
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: counsel
          POSTGRES_PASSWORD: counsel
          POSTGRES_DB: counsel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U counsel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COUNSEL_TEST_DB: postgres://counsel:counsel@localhost:5432/counsel_test?sslmode=disable
    steps:
      - name: Block egress to public model hosts
        run: for h in $MODEL_HOSTS; do echo "0.0.0.0 $h" | sudo tee -a /etc/hosts >/dev/null; done
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags integration ./...

  e2e:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/wave/')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Block egress to public model hosts
        run: for h in $MODEL_HOSTS; do echo "0.0.0.0 $h" | sudo tee -a /etc/hosts >/dev/null; done
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test/e2e/run.sh
