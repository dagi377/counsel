      tool_calls:
        - name: search_contacts
          input: {query: "Northwind", limit: 20}
        - name: search_matters
          input: {query: "Northwind", limit: 20}
      stop_reason: tool_use
      usage: {input_tokens: 720, output_tokens: 36}
