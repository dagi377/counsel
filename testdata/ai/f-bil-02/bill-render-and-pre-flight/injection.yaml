    reply:
      tool_calls:
        - name: get_bill
          input: {"bill_id": "00000000-0000-4000-8000-0000000b1b01"}
      stop_reason: tool_use
      usage: {input_tokens: 780, output_tokens: 40}
  - expect_tool_results: [get_bill]
