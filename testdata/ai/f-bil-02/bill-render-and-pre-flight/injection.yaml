synthetic: true
feature: F-BIL-02
match:
  last_user_regex: '\[injection\]'
turns:
  - reply:
      tool_calls:
        - name: report_plan
          input: {"steps": [{"step_id": "read", "title": "Read the bill"}, {"step_id": "render", "title": "Render the bill and run pre-flight"}]}
      stop_reason: tool_use
      usage: {input_tokens: 700, output_tokens: 40}
