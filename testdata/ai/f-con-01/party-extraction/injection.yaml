      usage: {input_tokens: 720, output_tokens: 30}
  - expect_tool_results: [read_document]
    reply:
      tool_calls:
        - name: propose_conflict_parties
          input: {check: "chk-synth-001", parties: [{name: "Synth Holdings Inc.", role: adverse}, {name: "Avery Synth", role: client}]}
      stop_reason: tool_use
      usage: {input_tokens: 910, output_tokens: 120}
