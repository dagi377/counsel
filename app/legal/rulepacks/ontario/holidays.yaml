# Ontario court holiday calendar, as rule-pack data. The dated holidays are not listed here:
# they are generated by rule for a rolling window (the previous year through ten years
# ahead) by CourtCalendar in holidays.go, so no year silently loses its holidays.
# Source (verify): Rules of Civil Procedure, R.R.O. 1990, Reg. 194, r. 1.03(1) "holiday":
# any Saturday or Sunday; New Year's Day, Family Day, Good Friday, Easter Monday, Victoria
# Day, Canada Day, Civic Holiday, Labour Day, Thanksgiving Day, Remembrance Day, Christmas
# Day and Boxing Day; when New Year's Day, Canada Day or Remembrance Day falls on a Saturday
# or Sunday, the following Monday; when Christmas Day falls on a Saturday or Sunday, the
# following Monday and Tuesday; when Christmas Day falls on a Friday, the following Monday.
# Court and procedural deadlines use this calendar. Limitation periods do NOT: they use the
# Legislation Act, 2006 s.87 calendar (LegislationActCalendar in holidays.go), which has no
# Saturday substitutes, with the s.88 roll.
# Sep 30, National Day for Truth and Reconciliation (verify): a federal holiday, but not
# named in r. 1.03 or Legislation Act s.87 and Ontario court offices stay open, so it is
# NOT generated. Confirm with the lawyer before adding it.
# Feature flag: deadline.ontario_pack (off by default).
pack: ontario_holidays
version: 1
time_zone: America/Toronto
rules:
  - id: next_court_day
    description: The first court day on or after the trigger date.
    trigger: any_date
    offset_days: 0
    day_count: business
    roll: forward
    confirm: true
