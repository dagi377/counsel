  - "2026-08-03" # Civic Holiday
  - "2026-09-07" # Labour Day
  # "2026-09-30" National Day for Truth and Reconciliation (Wednesday): (verify), not counted
  - "2026-10-12" # Thanksgiving Day
  - "2026-11-11" # Remembrance Day
  - "2026-12-25" # Christmas Day
  - "2026-12-26" # Boxing Day (Saturday)
  - "2026-12-28" # Monday after Christmas Day falling on a Friday
  # 2027
  - "2027-01-01" # New Year's Day
  - "2027-02-15" # Family Day
  - "2027-03-26" # Good Friday
  - "2027-03-29" # Easter Monday
  - "2027-05-24" # Victoria Day
  - "2027-07-01" # Canada Day
  - "2027-08-02" # Civic Holiday
  - "2027-09-06" # Labour Day
  # "2027-09-30" National Day for Truth and Reconciliation (Thursday): (verify), not counted
  - "2027-10-11" # Thanksgiving Day
  - "2027-11-11" # Remembrance Day
  - "2027-12-25" # Christmas Day (Saturday)
  - "2027-12-27" # Monday after Christmas Day on a weekend
  - "2027-12-28" # Tuesday after Christmas Day on a weekend
  # 2028
  - "2028-01-01" # New Year's Day (Saturday)
  - "2028-01-03" # Monday after New Year's Day on a Saturday
  - "2028-02-21" # Family Day
  - "2028-04-14" # Good Friday
  - "2028-04-17" # Easter Monday
  - "2028-05-22" # Victoria Day
  - "2028-07-01" # Canada Day (Saturday)
