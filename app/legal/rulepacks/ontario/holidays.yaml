# Ontario court holidays, 2025 to 2028, as rule-pack data. Source: Rules of Civil Procedure,
# R.R.O. 1990, Reg. 194, r. 1.03(1) "holiday", and Legislation Act, 2006, S.O. 2006, c. 21,
# Sch. F, s. 88 "holiday". Court closure days are the r. 1.03 substitutes: when New Year's
# Day, Canada Day or Remembrance Day falls on a Saturday or Sunday, the following Monday;
# when Christmas Day falls on a Saturday or Sunday, the following Monday and Tuesday; when
# Christmas Day falls on a Friday, the following Monday. Easter Monday is a court holiday
# though not an ESA public holiday. Sundays are not listed (business day counting already
# skips weekends); a holiday on a Saturday is listed for the record.
# Sep 30, National Day for Truth and Reconciliation (verify): a federal holiday, but not
# named in r. 1.03 or Legislation Act s. 88 and Ontario court offices stay open, so it is
# NOT counted. Counting it would roll a deadline past a day the court is open. Confirm with
# the owner before adding it; the dates are noted per year below.
# A year outside 2025 to 2028 is not covered: extend this file before relying on it.
# Feature flag: deadline.ontario_pack (off by default).
pack: ontario_holidays
version: 1
time_zone: America/Toronto
holidays:
  # 2025
  - "2025-01-01" # New Year's Day
  - "2025-02-17" # Family Day
  - "2025-04-18" # Good Friday
  - "2025-04-21" # Easter Monday
  - "2025-05-19" # Victoria Day
  - "2025-07-01" # Canada Day
  - "2025-08-04" # Civic Holiday
  - "2025-09-01" # Labour Day
  # "2025-09-30" National Day for Truth and Reconciliation (Tuesday): (verify), not counted
  - "2025-10-13" # Thanksgiving Day
  - "2025-11-11" # Remembrance Day
  - "2025-12-25" # Christmas Day
  - "2025-12-26" # Boxing Day
  # 2026
