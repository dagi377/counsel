# Ontario court holidays (Rules of Civil Procedure, r. 1.03 "holiday"), as rule-pack data.
# Weekends are not listed: business day counting already skips them. Substitute days
# follow r. 1.03: when Christmas Day falls on a Friday, the following Monday is a holiday.
# Feature flag: deadline.ontario_pack (off by default).
pack: ontario_holidays
version: 1
time_zone: America/Toronto
holidays:
  - "2026-01-01" # New Year's Day
  - "2026-02-16" # Family Day
  - "2026-04-03" # Good Friday
  - "2026-04-06" # Easter Monday
  - "2026-05-18" # Victoria Day
  - "2026-07-01" # Canada Day
  - "2026-08-03" # Civic Holiday
  - "2026-09-07" # Labour Day
  - "2026-10-12" # Thanksgiving Day
  - "2026-11-11" # Remembrance Day
  - "2026-12-25" # Christmas Day
  - "2026-12-26" # Boxing Day (Saturday)
  - "2026-12-28" # Monday after Christmas Day falling on a Friday
rules:
  - id: next_court_day
    description: The first court day on or after the trigger date.
    trigger: any_date
    offset_days: 0
    day_count: business
    roll: forward
    confirm: true
