  - "2028-12-25" # Christmas Day
  - "2028-12-26" # Boxing Day
rules:
  - id: next_court_day
    description: The first court day on or after the trigger date.
    trigger: any_date
    offset_days: 0
    day_count: business
    roll: forward
    confirm: true
