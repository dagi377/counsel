# Ontario Rules of Civil Procedure (R.R.O. 1990, Reg. 194) day counting, as rule-pack data.
# Every entry is (verify): a lawyer must confirm it before the flag is turned on.
# Feature flag: deadline.ontario_pack (off by default). Every computed date needs a person's
# confirmation (confirm: true).
#
# r. 3.01(1)(a): exclude the trigger day, include the last day ("clear days" is abolished),
#   so periods use day_count calendar, not clear.
# r. 3.01(1)(b): holidays are not counted only in a period of LESS than seven days -> a
#   period of 1 to 6 days uses day_count business; a period of 7 days or more counts every
#   calendar day (holidays included) -> day_count calendar.
# r. 3.01(1)(c): a period that ends on a holiday ends on the next day that is not -> roll forward.
# r. 1.03(1) "holiday" includes any Saturday and Sunday (business counting and the forward
#   roll skip both); the dated holidays below match holidays.yaml.
# r. 18.01 / 18.02: the notice of intent to defend is due within the time for the statement
#   of defence (20 days in Ontario); delivering it in time gives 10 more days for the
#   defence (30 days from service). Only Ontario service is modelled (r. 18.01(a)); service
#   elsewhere in Canada or the US (40 days) and elsewhere (60 days) is not.
# Not expressible yet (left out): periods counted back from a hearing, and the
# December 21 - January 6 pleading service rule.
pack: ontario_civil_procedure
version: 1
time_zone: America/Toronto
