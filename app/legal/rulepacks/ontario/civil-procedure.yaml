  - "2027-07-01" # Canada Day
  - "2027-08-02" # Civic Holiday
  - "2027-09-06" # Labour Day
  # "2027-09-30" National Day for Truth and Reconciliation (Thursday): (verify), not counted
  - "2027-10-11" # Thanksgiving Day
  - "2027-11-11" # Remembrance Day
  - "2027-12-25" # Christmas Day (Saturday)
  - "2027-12-27" # Monday after Christmas Day on a weekend
  - "2027-12-28" # Tuesday after Christmas Day on a weekend
