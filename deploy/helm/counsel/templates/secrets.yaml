{{- $cell := required "cell is required (ARC-U-001)" .Values.cell }}
{{- $ns := printf "counsel-%s" $cell }}
{{- $r := .Values.rotation }}
# rule: ARC-U-039
# The cell's own secret store; secret values never appear in the chart.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: counsel-{{ $cell }}
  namespace: {{ $ns }}
  labels:
    counsel.io/cell: {{ $cell | quote }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region.primary | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: counsel-{{ $cell }}
{{- range $r.dualValueSecrets }}
---
# rule: ARC-U-039
# Two active values during rotation: new signatures and tokens use current; verification
# accepts current and previous.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: counsel-{{ $cell }}-{{ . }}
  namespace: {{ $ns }}
  labels:
    counsel.io/cell: {{ $cell | quote }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: counsel-{{ $cell }}
  target:
    name: counsel-{{ $cell }}-{{ . }}
  data:
    - secretKey: current
      remoteRef:
        key: counsel/{{ $cell }}/{{ . }}
        property: current
    - secretKey: previous
      remoteRef:
        key: counsel/{{ $cell }}/{{ . }}
        property: previous
{{- end }}
---
# rule: ARC-U-039
# DB credentials rotate by alternating two roles; the app uses whichever is active.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: counsel-{{ $cell }}-db-roles
  namespace: {{ $ns }}
  labels:
    counsel.io/cell: {{ $cell | quote }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: counsel-{{ $cell }}
  target:
    name: counsel-{{ $cell }}-db-roles
  data:
  {{- range $r.dbRoles }}
    - secretKey: {{ . }}
      remoteRef:
        key: counsel/{{ $cell }}/db-roles
        property: {{ . }}
  {{- end }}
---
# rule: ARC-U-039
# Envelope encryption: every ciphertext carries the key id, so reads accept old and new key
# versions until re-encryption completes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: counsel-{{ $cell }}-kms
  namespace: {{ $ns }}
  labels:
    counsel.io/cell: {{ $cell | quote }}
data:
  key_id: {{ printf "arn:aws:kms:%s:%s:alias/counsel-%s" .Values.region.primary .Values.aws.accountId $cell | quote }}
  key_id_in_ciphertext: "true"
---
# rule: ARC-U-039
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: counsel-{{ $cell }}-tls
  namespace: {{ $ns }}
  labels:
    counsel.io/cell: {{ $cell | quote }}
  annotations:
    counsel.io/expiry-alert-before: {{ $r.certAlertBefore | quote }}
spec:
  secretName: counsel-{{ $cell }}-tls
  dnsNames:
    - {{ printf "%s.%s" $cell .Values.domain | quote }}
  duration: {{ $r.certDuration | quote }}
  renewBefore: {{ $r.certRenewBefore | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ $r.certIssuer | quote }}
