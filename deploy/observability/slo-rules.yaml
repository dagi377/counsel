# Prometheus recording rules and alerts for SLO-01..10 (spec/eng/a1-uptime.json).
# Every SLI is exported per cell as slo_bad_total / slo_valid_total with label slo.
# rule: ARC-U-034 multi-window burn rate: page 14.4x (1h and 5m), page 6x (6h and 30m),
# ticket 1x (3d). rule: ARC-U-037 a fast burn is a SEV2 incident.
# rule: ARC-U-029 SLO-08 counts only while the agent platform is healthy; while it is down
# jobs stay queued and AgentJobsQueuedWhileDown tickets instead of burning budget.
# rule: ARC-U-036 status_component maps each SLO to a public status page component.
# Generated shape is checked by kernel/metrics/synthetic_test.go.
groups:
  - name: slo-01
    rules:
      - record: slo:error_ratio:rate5m
        expr: 'sum(rate(slo_bad_total{slo="SLO-01"}[5m])) / sum(rate(slo_valid_total{slo="SLO-01"}[5m]))'
        labels:
          slo: SLO-01
      - record: slo:error_ratio:rate30m
        expr: 'sum(rate(slo_bad_total{slo="SLO-01"}[30m])) / sum(rate(slo_valid_total{slo="SLO-01"}[30m]))'
        labels:
          slo: SLO-01
      - record: slo:error_ratio:rate1h
        expr: 'sum(rate(slo_bad_total{slo="SLO-01"}[1h])) / sum(rate(slo_valid_total{slo="SLO-01"}[1h]))'
        labels:
          slo: SLO-01
      - record: slo:error_ratio:rate6h
        expr: 'sum(rate(slo_bad_total{slo="SLO-01"}[6h])) / sum(rate(slo_valid_total{slo="SLO-01"}[6h]))'
        labels:
          slo: SLO-01
      - record: slo:error_ratio:rate3d
        expr: 'sum(rate(slo_bad_total{slo="SLO-01"}[3d])) / sum(rate(slo_valid_total{slo="SLO-01"}[3d]))'
        labels:
          slo: SLO-01
      - alert: SLOFastBurn
        expr: 'slo:error_ratio:rate1h{slo="SLO-01"} > (14.4 * 0.001) and slo:error_ratio:rate5m{slo="SLO-01"} > (14.4 * 0.001)'
        for: 2m
        labels:
          slo: SLO-01
          severity: page
          incident_severity: SEV2
          burn_rate: "14.4"
          status_component: app
        annotations:
          summary: SLO-01 cell web/API availability burning error budget at 14.4x
      - alert: SLOSlowBurn
        expr: 'slo:error_ratio:rate6h{slo="SLO-01"} > (6 * 0.001) and slo:error_ratio:rate30m{slo="SLO-01"} > (6 * 0.001)'
        for: 15m
        labels:
          slo: SLO-01
          severity: page
          incident_severity: SEV2
          burn_rate: "6"
          status_component: app
        annotations:
          summary: SLO-01 cell web/API availability burning error budget at 6x
      - alert: SLOBudgetBurn
        expr: 'slo:error_ratio:rate3d{slo="SLO-01"} > (1 * 0.001)'
        for: 1h
        labels:
          slo: SLO-01
          severity: ticket
          incident_severity: SEV3
          burn_rate: "1"
          status_component: app
        annotations:
          summary: SLO-01 cell web/API availability burning error budget at 1x
