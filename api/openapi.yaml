        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: counsel_session, description: OIDC-backed browser session (members). Only sessions
        may decide gates.}
    bearer: {type: http, scheme: bearer, description: 'API keys (firm integrations, scopes = capability ids) and agent tokens
        issued via the Paploo app-API connection (principal type agent, acting_for user). Neither may decide gates.'}
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID; stored 30 days per (firm, principal, key) with request hash (ARC-I-007/008).
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the version being changed. Missing -> 428, stale -> 412.
      schema:
        type: string
        examples: ['"7"']
    BillId:
      name: bill_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    WithdrawalId:
      name: withdrawal_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    GateId:
      name: gate_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
  headers:
    ETag:
      description: Strong ETag "<version>"
      schema: {type: string}
  responses:
    Problem:
      description: RFC 9457 problem
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Id: {type: string, format: uuid, description: UUIDv7}
    Cents: {type: integer, minimum: 0, maximum: 100000000000, description: Non-negative amount in CAD cents.}
    SignedCents: {type: integer, description: 'Signed amount in CAD cents (receipt +, disbursement -).'}
    Actor:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [user, agent, api_key, system]
        id: {type: string}
        acting_for: {$ref: '#/components/schemas/Id'}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          examples: ['urn:counsel:problem:sod_violation']
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code:
          type: string
          description: Stable machine code. x-extensible-enum.
          examples: [validation_failed, invalid_money, version_conflict, precondition_required, idempotency_key_required,
            idempotency_key_reused, request_in_progress, sod_violation, missing_capability, not_signatory, agent_cannot_decide,
            step_up_required, payload_changed, gate_expired, already_decided, allocation_mismatch, insufficient_trust_funds,
            executor_is_authorizer, read_only_field, unverified_citation, plan_required, rate_limited, not_found]
        trace_id: {type: string}
        gate_id: {$ref: '#/components/schemas/Id'}
        errors:
          type: array
          items:
            type: object
            required: [pointer, code]
            properties:
              pointer: {type: string, description: JSON Pointer into the request body}
              code: {type: string}
    BillStatus:
      type: string
      enum: [draft, in_review, returned, approved, delivered, partially_paid, paid, voided]
      x-extensible-enum: true
    Bill:
      type: object
      required: [id, version, matter_id, client_id, status, period_from, period_to, fees_cents, taxable_disb_cents, nontaxable_disb_cents,
        hst_rate_ppm, hst_cents, discount_cents, total_cents, trust_applied_cents, balance_cents, created_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version: {type: integer}
        number:
          type: [string, 'null']
          description: Assigned only on approval (gapless per firm)
        matter_id: {$ref: '#/components/schemas/Id'}
        client_id: {$ref: '#/components/schemas/Id'}
        status: {$ref: '#/components/schemas/BillStatus'}
        period_from: {type: string, format: date}
        period_to: {type: string, format: date}
        fees_cents: {$ref: '#/components/schemas/Cents'}
        taxable_disb_cents: {$ref: '#/components/schemas/Cents'}
        nontaxable_disb_cents: {$ref: '#/components/schemas/Cents'}
        hst_rate_ppm: {type: integer, description: 'parts per million, e.g. 130000 = 13%; QST 9.975% = 99750 (CF-01)'}
        hst_cents: {$ref: '#/components/schemas/Cents'}
        discount_cents: {$ref: '#/components/schemas/Cents'}
        total_cents: {$ref: '#/components/schemas/Cents'}
        trust_applied_cents: {$ref: '#/components/schemas/Cents'}
        balance_cents: {type: integer}
        gate_id: {$ref: '#/components/schemas/Id'}
        approved_by: {$ref: '#/components/schemas/Id'}
        approved_at: {type: string, format: date-time}
        delivered_at: {type: string, format: date-time}
        delivery_channel:
          type: string
          enum: [portal, email, print]
        template_id: {$ref: '#/components/schemas/Id'}
        split_parent_id: {$ref: '#/components/schemas/Id'}
        created_at: {type: string, format: date-time}
        reserved_cents: {$ref: '#/components/schemas/Cents', readOnly: true, description: fee withdrawals from trust authorized
            or executed-not-applied against this bill; allocations cap at balance - reserved}
    BillCreate:
      type: object
      additionalProperties: false
      required: [matter_id, period_to]
      properties:
        matter_id: {$ref: '#/components/schemas/Id'}
        period_from: {type: string, format: date}
        period_to: {type: string, format: date}
        template_id: {$ref: '#/components/schemas/Id'}
        line_actions:
          type: array
          items: {$ref: '#/components/schemas/LineAction'}
    BillPatch:
      type: object
      additionalProperties: false
      description: Totals, status, number and approval fields are read-only (422 read_only_field).
      properties:
        period_from: {type: string, format: date}
        period_to: {type: string, format: date}
        template_id: {$ref: '#/components/schemas/Id'}
        discount_cents: {$ref: '#/components/schemas/Cents'}
        line_actions:
          type: array
          items: {$ref: '#/components/schemas/LineAction'}
    LineAction:
      type: object
      additionalProperties: false
      required: [source_id, action]
      properties:
        source_id: {$ref: '#/components/schemas/Id'}
        action:
          type: string
          enum: [bill, hold, write_down, write_off, no_charge]
        write_down_cents: {$ref: '#/components/schemas/Cents'}
        reason_code: {type: string, maxLength: 64}
        narrative: {type: string, maxLength: 1000}
    BillLine:
      type: object
      required: [id, bill_id, source_type, amount_cents, taxable, action]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        bill_id: {$ref: '#/components/schemas/Id'}
        source_type:
          type: string
          enum: [time, expense, flat, adjustment]
        source_id: {$ref: '#/components/schemas/Id'}
        narrative: {type: string}
        quantity_milli: {type: integer, description: quantity x 1000 (hours as minutes/60 never float)}
        rate_cents: {$ref: '#/components/schemas/Cents'}
        amount_cents: {type: integer}
        taxable: {type: boolean}
        action:
          type: string
          enum: [bill, hold, write_down, write_off, no_charge]
        write_down_cents: {$ref: '#/components/schemas/Cents'}
        reason_code: {type: string}
        agent_flags:
          type: array
          items: {type: string}
    PaymentCreate:
      type: object
      additionalProperties: false
      required: [received_at, payer_contact_id, amount_cents, method]
      properties:
        received_at: {type: string, format: date-time}
        payer_contact_id: {$ref: '#/components/schemas/Id'}
        amount_cents: {$ref: '#/components/schemas/Cents'}
        method:
          type: string
          enum: [eft, cheque, card, cash, wire, interac]
        provider: {type: string}
        provider_ref: {type: string, maxLength: 120}
        processor_fee_cents: {$ref: '#/components/schemas/Cents'}
        allocations:
          type: array
          items: {$ref: '#/components/schemas/AllocationInput'}
    AllocationInput:
      type: object
      additionalProperties: false
      required: [target_type, amount_cents]
      properties:
        target_type:
          type: string
          enum: [bill, trust_ledger, unapplied]
        target_id: {$ref: '#/components/schemas/Id'}
        amount_cents: {$ref: '#/components/schemas/Cents'}
      description: target_type=bill only for an operating-account payment; a trust-account payment may only target trust_ledger
        (422 trust_receipt_not_allocatable). Bucket split is computed by the server (ARC-I-029).
    Payment:
      type: object
      required: [id, version, received_at, amount_cents, method, account, status, allocations]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version: {type: integer}
        received_at: {type: string, format: date-time}
        payer_contact_id: {$ref: '#/components/schemas/Id'}
        amount_cents: {$ref: '#/components/schemas/Cents'}
        method: {type: string}
        account:
          type: string
          enum: [operating, trust]
        provider: {type: string}
        provider_ref: {type: string}
        processor_fee_cents: {$ref: '#/components/schemas/Cents'}
        status:
          type: string
          enum: [received, allocation_pending, allocated, failed, refunded, partially_refunded, reversed]
          x-extensible-enum: true
        allocations:
          type: array
          items:
            type: object
            required: [id, target_type, amount_cents, state]
            properties:
              id: {$ref: '#/components/schemas/Id'}
              target_type:
                type: string
                enum: [bill, trust_ledger, unapplied]
              target_id: {$ref: '#/components/schemas/Id'}
              amount_cents: {$ref: '#/components/schemas/Cents'}
              state:
                type: string
                enum: [proposed, applied, reversed]
              gate_id: {$ref: '#/components/schemas/Id'}
              fee_cents: {$ref: '#/components/schemas/SignedCents', readOnly: true}
              dtx_cents: {$ref: '#/components/schemas/SignedCents', readOnly: true}
              dnt_cents: {$ref: '#/components/schemas/SignedCents', readOnly: true}
              tax_cents: {$ref: '#/components/schemas/SignedCents', readOnly: true}
              interest_cents: {$ref: '#/components/schemas/SignedCents', readOnly: true}
            description: For target_type=bill, fee+dtx+dnt+tax+interest = amount_cents; all zero otherwise. Reversal rows
              are -1 x original per bucket.
    CreditNoteCreate:
      type: object
      additionalProperties: false
      required: [bill_id, kind, amount_cents, reason_code]
      properties:
        bill_id: {$ref: '#/components/schemas/Id'}
        kind:
          type: string
          enum: [credit, write_off]
        amount_cents: {$ref: '#/components/schemas/Cents'}
        reason_code: {type: string, maxLength: 64}
        trust_effect:
          type: string
          enum: [none, refund_to_trust]
          default: none
    CreditNote:
      type: object
      required: [id, bill_id, kind, amount_cents, hst_cents, status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        number:
          type: [string, 'null']
        bill_id: {$ref: '#/components/schemas/Id'}
        kind:
          type: string
          enum: [credit, write_off]
        amount_cents: {$ref: '#/components/schemas/Cents'}
        hst_cents: {$ref: '#/components/schemas/Cents'}
        reason_code: {type: string}
        status:
          type: string
          enum: [requested, issued, rejected]
        gate_id: {$ref: '#/components/schemas/Id'}
    TrustAccount:
      type: object
      required: [id, type, institution, account_no_masked, opened_on]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        type:
          type: string
          enum: [mixed, separate]
        institution: {type: string}
        account_no_masked:
          type: string
          examples: ['****1234']
        for_matter_id: {$ref: '#/components/schemas/Id'}
        opened_on: {type: string, format: date}
        closed_on:
          type: [string, 'null']
          format: date
        dual_authorization: {type: boolean}
    TrustLedger:
      type: object
      required: [id, account_id, client_id, matter_id, balance_cents, available_cents]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        account_id: {$ref: '#/components/schemas/Id'}
        client_id: {$ref: '#/components/schemas/Id'}
        matter_id: {$ref: '#/components/schemas/Id'}
        balance_cents: {$ref: '#/components/schemas/Cents'}
        available_cents: {$ref: '#/components/schemas/Cents', description: posted cleared balance - protected - minimum -
            authorized holds (ARC-I-025)}
        protected_cents: {$ref: '#/components/schemas/Cents'}
        pending_withdrawals_cents: {$ref: '#/components/schemas/Cents', description: 'sum of authorized, not yet executed
            withdrawals'}
        last_activity_on: {type: string, format: date}
        overdrawn: {type: boolean, description: true when the posted or available balance is below zero (By-law 9);
            shown as an error state}
        shortfall_cents: {$ref: '#/components/schemas/Cents', description: amount below zero of the lower of the posted
            and available balances; 0 when not overdrawn}
    TrustJournalLine:
      type: object
      required: [id, account_id, ledger_id, kind, posted_on, amount_cents, posted_by, posted_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        account_id: {$ref: '#/components/schemas/Id'}
        ledger_id: {$ref: '#/components/schemas/Id'}
        kind:
          type: string
          enum: [receipt, disbursement, transfer, correction]
        posted_on: {type: string, format: date}
        method: {type: string}
        instrument_no: {type: string}
        counterparty: {type: string}
        amount_cents: {$ref: '#/components/schemas/SignedCents'}
        purpose: {type: string}
        reverses_id: {$ref: '#/components/schemas/Id'}
        gate_id: {$ref: '#/components/schemas/Id'}
        posted_by: {$ref: '#/components/schemas/Id'}
        posted_at: {type: string, format: date-time}
        month_locked: {type: boolean}
      description: One row of a4 trust.trust_transaction.
    TrustReceiptCreate:
      type: object
      additionalProperties: false
      required: [account_id, matter_id, received_on, amount_cents, method, payer]
      properties:
        account_id: {$ref: '#/components/schemas/Id'}
        matter_id: {$ref: '#/components/schemas/Id'}
        received_on: {type: string, format: date}
        amount_cents: {$ref: '#/components/schemas/Cents'}
        method:
          type: string
          enum: [eft, cheque, cash, wire, card, interac]
        payer: {type: string, maxLength: 200}
        instrument_no: {type: string, maxLength: 40}
        purpose: {type: string, maxLength: 200}
        payment_id: {$ref: '#/components/schemas/Id'}
    WithdrawalStatus:
      type: string
      enum: [draft, awaiting_authorization, authorized, executed, applied, confirmed, rejected, expired, cancelled, effect_failed]
      x-extensible-enum: true
      description: authorized = held against the ledger and the bill; executed = posted; applied = fee withdrawal applied
        to its bill; confirmed = matched to a bank line (ARC-I-025, -027).
    WithdrawalCreate:
      type: object
      additionalProperties: false
      required: [ledger_id, amount_cents, purpose_category, payee, method]
      properties:
        ledger_id: {$ref: '#/components/schemas/Id'}
        amount_cents: {$ref: '#/components/schemas/Cents'}
        purpose_category:
          type: string
          enum: [fees, disbursement, client_payment, third_party, refund]
        payee: {type: string, maxLength: 200}
        method:
          type: string
          enum: [eft, cheque, wire]
        bill_id: {$ref: '#/components/schemas/Id'}
        direction_document_id: {$ref: '#/components/schemas/Id'}
        receiving_account_masked: {type: string}
    WithdrawalRequest:
      type: object
      required: [id, version, ledger_id, amount_cents, purpose_category, payee, method, status, initiated_by]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version: {type: integer}
        ledger_id: {$ref: '#/components/schemas/Id'}
        amount_cents: {$ref: '#/components/schemas/Cents'}
        purpose_category: {type: string}
        payee: {type: string}
        method: {type: string}
        bill_id: {$ref: '#/components/schemas/Id'}
        status: {$ref: '#/components/schemas/WithdrawalStatus'}
        gate_id: {$ref: '#/components/schemas/Id'}
        initiated_by: {$ref: '#/components/schemas/Actor'}
        authorized_by:
          type: array
          items: {$ref: '#/components/schemas/Id'}
        executed_by: {$ref: '#/components/schemas/Id'}
        bank_ref: {type: string}
        journal_line_id: {$ref: '#/components/schemas/Id'}
    Reconciliation:
      type: object
      required: [id, version, account_id, month, bank_balance_cents, outstanding_items_cents, adjusted_bank_cents, journal_balance_cents,
        client_listing_total_cents, status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version: {type: integer}
        account_id: {$ref: '#/components/schemas/Id'}
        month: {type: string}
        bank_balance_cents: {type: integer}
        outstanding_items_cents: {type: integer}
        adjusted_bank_cents: {type: integer}
        journal_balance_cents: {type: integer}
        client_listing_total_cents: {type: integer}
        balanced: {type: boolean, description: adjusted_bank == journal_balance == client_listing_total}
        status:
          type: string
          enum: [prepared, in_review, signed, superseded]
        gate_id: {$ref: '#/components/schemas/Id'}
        signed_by: {$ref: '#/components/schemas/Id'}
        signed_at: {type: string, format: date-time}
    GateState:
      type: string
      enum: [open, partially_approved, returned, approved_cooling, approved, executing, executed, effect_failed, rejected,
        expired, withdrawn]
    Gate:
      type: object
      required: [id, kind, version, state, subject, payload, payload_hash, preparers, min_approvers, opened_at, expires_at,
        decisions]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind:
          type: string
          examples: [trust.withdrawal]
        version: {type: integer}
        state: {$ref: '#/components/schemas/GateState'}
        risk:
          type: string
          enum: [low, medium, high, irreversible]
        capability: {type: string}
        subject:
          type: object
          required: [type, id]
          properties:
            type: {type: string}
            id: {$ref: '#/components/schemas/Id'}
            matter_id: {$ref: '#/components/schemas/Id'}
        payload: {type: object, description: Validated against the kind's payload schema; data only}
        payload_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        preparers:
          type: array
          items: {$ref: '#/components/schemas/Actor'}
        min_approvers: {type: integer}
        opened_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        effect_after:
          type: [string, 'null']
          format: date-time
        decisions:
          type: array
          items:
            type: object
            required: [decider_id, decision, version, at]
            properties:
              decider_id: {$ref: '#/components/schemas/Id'}
              decision:
                type: string
                enum: [approve, recommend, return, reject]
              version: {type: integer}
              reason: {type: string}
              at: {type: string, format: date-time}
        effect:
          type: object
          properties:
            handler: {type: string}
            state:
              type: string
              enum: [pending, running, succeeded, failed]
            result_ref: {type: string}
            error_code: {type: string}
    GateDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, version, payload_hash]
      properties:
        decision:
          type: string
          enum: [approve, return, reject]
        version: {type: integer}
        payload_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        reason: {type: string, maxLength: 1000, description: Required for return and reject}
        sole_practitioner_declaration: {type: string, maxLength: 500}
