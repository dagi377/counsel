# CONTRACT: Counsel HTTP API v1, a byte-for-byte copy of spec/eng/a2-interfaces.openapi.yaml
# below this header. /v1 is additive only (ARC-I-001): new endpoints, new optional request
# fields, new response fields, new values on x-extensible-enum enums. Removing or renaming a
# field or making one required needs /v2 and a docs/QUESTIONS.md entry first.
# kernel/contract/openapi_test.go enforces this.
openapi: 3.1.0
info:
  title: Counsel API
  version: 1.0.0
  description: |
    Counsel HTTP API v1 (one cell per firm; host is the firm's cell hostname).
    Conventions (rules ARC-I-001..012, -047..051 in a2-interfaces.html):
    - JSON only; money is integer cents in fields ending _cents, currency CAD.
    - Business dates YYYY-MM-DD in America/Toronto; instants RFC 3339 with offset.
    - Cursor pagination (limit, cursor -> next_cursor).
    - ETag/If-Match on every mutable resource (version integer).
    - Idempotency-Key required on every POST that creates money records or external effects; such operations carry
      x-money: true or x-external-effect: true (ARC-I-007; conformance asserts count(x-money) >= 20).
    - Rates are parts per million (*_ppm). Module and gate-kind names follow the a4 schemas (CF-05).
    - Every operation lists its problem responses explicitly (ARC-I-051).
    - Errors: RFC 9457 application/problem+json.
    - /v1 is additive-only.
    Money endpoints (bills, payments, credit notes, trust) are specified in detail; the rest at path level.
servers:
- url: https://{cell_host}/v1
  variables:
    cell_host: {default: firm.example.ca}
security:
- session: []
- bearer: []
tags:
- {name: billing}
- {name: payments}
- {name: trust}
- {name: gates}
- {name: matters}
- {name: other}
paths:
  /bills:
    get:
      tags: [billing]
      operationId: listBills
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: matter_id
        in: query
        schema: {$ref: '#/components/schemas/Id'}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/BillStatus'}
      responses:
        '200':
          description: Page of bills
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Bill'}
                  next_cursor:
                    type: [string, 'null']
        '401': &id001 {$ref: '#/components/responses/Problem'}
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
    post:
      tags: [billing]
      operationId: draftBill
      summary: Create a draft bill (pre-bill) from unbilled WIP. Opens gate billing.prebill_review on submit.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillCreate'}
      responses:
        '201':
          description: Draft created
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bill'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      x-money: true
  /bills/{bill_id}:
    parameters:
    - {$ref: '#/components/parameters/BillId'}
    get:
      tags: [billing]
      operationId: getBill
      responses:
        '200':
          description: Bill
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bill'}
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
    patch:
      tags: [billing]
      operationId: updateDraftBill
      summary: Edit a draft bill (status draft or returned only). Totals are always recomputed server-side.
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/BillPatch'}
      responses:
        '200':
          description: Updated
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bill'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
  /bills/{bill_id}/lines:
    parameters:
    - {$ref: '#/components/parameters/BillId'}
    get:
      tags: [billing]
      operationId: listBillLines
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Lines
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/BillLine'}
                  next_cursor:
                    type: [string, 'null']
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
  /bills/{bill_id}/submit:
    parameters:
    - {$ref: '#/components/parameters/BillId'}
    post:
      tags: [billing, gates]
      operationId: submitBill
      summary: Submit draft for approval. Opens gate billing.bill_approval bound to the bill's payload hash. Never approves.
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                delivery_method:
                  type: string
                  enum: [email, portal, mail]
                  default: email
      responses:
        '202':
          description: Gate opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Gate'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      x-money: true
  /bills/{bill_id}/deliver:
    parameters:
    - {$ref: '#/components/parameters/BillId'}
    post:
      tags: [billing]
      operationId: deliverBill
      summary: Deliver an approved bill to the client (external effect). Allowed only when status=approved.
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [portal, email, print]
                recipient_contact_ids:
                  type: array
                  items: {$ref: '#/components/schemas/Id'}
      responses:
        '202':
          description: Delivery queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bill'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      description: Queues delivery. delivered_at is set only by the delivery effect on evidence, as the America/Toronto date,
        and is immutable once set; a bounce leaves it null (ARC-I-052).
      x-money: true
  /bills/{bill_id}/void:
    parameters:
    - {$ref: '#/components/parameters/BillId'}
    post:
      tags: [billing, gates]
      operationId: voidBill
      summary: Void an approved, undelivered bill; opens gate billing.bill_void (G-B2).
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties:
                reason_code: {type: string, maxLength: 64}
      responses:
        '202':
          description: Gate opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Gate'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      description: Allowed only when status=approved and delivered_at is null (ARC-I-050). The effect posts the exact reversal
        (BIL-J-012), sets status=voided and returns entries to approved; no credit note. A delivered bill returns 409 code=bill_delivered_use_credit_note;
        use POST /credit-notes.
      x-money: true
  /payments:
    get:
      tags: [payments]
      operationId: listPayments
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: client_id
        in: query
        schema: {$ref: '#/components/schemas/Id'}
      - name: received_from
        in: query
        schema: {type: string, format: date}
      - name: received_to
        in: query
        schema: {type: string, format: date}
      responses:
        '200':
          description: Page of payments
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Payment'}
                  next_cursor:
                    type: [string, 'null']
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
    post:
      tags: [payments]
      operationId: recordPayment
      summary: Record a payment received into the operating account. Trust receipts use POST /trust/receipts.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentCreate'}
      responses:
        '201':
          description: Recorded (allocations proposed; unambiguous allocations to one bill apply directly, others open billing.payment_allocation)
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      x-money: true
  /payments/{payment_id}:
    parameters:
    - {$ref: '#/components/parameters/PaymentId'}
    get:
      tags: [payments]
      operationId: getPayment
      responses:
        '200':
          description: Payment
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
  /payments/{payment_id}/allocations:
    parameters:
    - {$ref: '#/components/parameters/PaymentId'}
    post:
      tags: [payments, gates]
      operationId: proposeAllocation
      summary: Replace the proposed allocation set. Sum must equal payment amount (ARC-I-029). Opens gate billing.payment_allocation
        when ambiguous or trust-touching.
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [allocations]
              properties:
                allocations:
                  type: array
                  minItems: 1
                  items: {$ref: '#/components/schemas/AllocationInput'}
      responses:
        '200':
          description: Applied directly
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '202':
          description: Gate opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Gate'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      x-money: true
  /payments/{payment_id}/refunds:
    parameters:
    - {$ref: '#/components/parameters/PaymentId'}
    post:
      tags: [payments, gates]
      operationId: requestRefund
      summary: Request a refund; opens gate billing.refund. Effect handler calls the provider with idempotency key <gate_id>:<version>.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_cents, reason_code]
              properties:
                amount_cents: {$ref: '#/components/schemas/Cents'}
                reason_code: {type: string, maxLength: 64}
      responses:
        '202':
          description: Gate opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Gate'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      x-money: true
  /credit-notes:
    get:
      tags: [billing]
      operationId: listCreditNotes
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: bill_id
        in: query
        schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CreditNote'}
                  next_cursor:
                    type: [string, 'null']
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
    post:
      tags: [billing, gates]
      operationId: requestCreditNote
      summary: Request a credit note or write-off; opens gate billing.credit_note. Number is assigned only by the effect handler.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreditNoteCreate'}
      responses:
        '202':
          description: Gate opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Gate'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      x-money: true
  /credit-notes/{credit_note_id}:
    get:
      tags: [billing]
      operationId: getCreditNote
      parameters:
      - name: credit_note_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: Credit note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreditNote'}
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
  /trust/accounts:
    get:
      tags: [trust]
      operationId: listTrustAccounts
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/TrustAccount'}
                  next_cursor:
                    type: [string, 'null']
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
  /trust/ledgers:
    get:
      tags: [trust]
      operationId: listTrustLedgers
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: matter_id
        in: query
        schema: {$ref: '#/components/schemas/Id'}
      - name: account_id
        in: query
        schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: Client trust ledgers
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/TrustLedger'}
                  next_cursor:
                    type: [string, 'null']
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
  /trust/ledgers/{ledger_id}/lines:
    get:
      tags: [trust]
      operationId: listTrustLines
      parameters:
      - name: ledger_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Journal lines, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/TrustJournalLine'}
                  next_cursor:
                    type: [string, 'null']
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
  /trust/receipts:
    post:
      tags: [trust, gates]
      operationId: recordTrustReceipt
      summary: Record money received into trust. Posts directly when classification is unambiguous and cash is under limit;
        otherwise opens trust.receipt_classification or trust.cash_over_limit.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrustReceiptCreate'}
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrustJournalLine'}
        '202':
          description: Gate opened; not yet posted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Gate'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      x-money: true
  /trust/withdrawals:
    get:
      tags: [trust]
      operationId: listWithdrawals
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/WithdrawalStatus'}
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/WithdrawalRequest'}
                  next_cursor:
                    type: [string, 'null']
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
    post:
      tags: [trust, gates]
      operationId: requestWithdrawal
      summary: Create a withdrawal request and open gate trust.withdrawal (or billing.trust_fee_withdrawal when bill_id is
        set). Authorization only via the gate.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WithdrawalCreate'}
      responses:
        '202':
          description: Request created and gate opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WithdrawalRequest'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      description: Opens the authorization gate. Authorization (gate decision) fails 409 code=insufficient_trust_funds when
        the amount exceeds the ledger's available balance including holds (ARC-I-025).
      x-money: true
  /trust/withdrawals/{withdrawal_id}:
    parameters:
    - {$ref: '#/components/parameters/WithdrawalId'}
    get:
      tags: [trust]
      operationId: getWithdrawal
      responses:
        '200':
          description: Withdrawal
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WithdrawalRequest'}
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        default: *id001
  /trust/withdrawals/{withdrawal_id}/execution:
    parameters:
    - {$ref: '#/components/parameters/WithdrawalId'}
    post:
      tags: [trust]
      operationId: recordWithdrawalExecution
      summary: 'Record that an authorized withdrawal was paid at the bank; posts the trust_transaction (txn_date = executed_on)
        and releases the hold. Not a way to authorize: the withdrawal''s gate must be approved and unexpired (else 409 not_authorized).
        Caller holds trust.execute and is not the authorizer unless sole practitioner (ARC-I-012, -027).'
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [executed_on, bank_ref]
              properties:
                executed_on: {type: string, format: date}
                bank_ref: {type: string, maxLength: 80}
                instrument_no: {type: string, maxLength: 40}
      responses:
        '201':
          description: Trust transaction posted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrustJournalLine'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      x-money: true
  /trust/withdrawals/{withdrawal_id}/cancel:
    parameters:
    - {$ref: '#/components/parameters/WithdrawalId'}
    post:
      tags: [trust]
      operationId: cancelWithdrawal
      summary: Cancel a request not yet executed; withdraws its open gate.
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WithdrawalRequest'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
        '422': *id001
        '428': *id001
        '429': *id001
        default: *id001
      x-money: true
  /trust/transfers:
    post:
      tags: [trust, gates]
      operationId: requestTransfer
      summary: Ledger-to-ledger or account-to-account transfer; opens gate trust.transfer.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from_ledger_id, to_ledger_id, amount_cents, authority_document_id]
              properties:
                from_ledger_id: {$ref: '#/components/schemas/Id'}
                to_ledger_id: {$ref: '#/components/schemas/Id'}
                amount_cents: {$ref: '#/components/schemas/Cents'}
                authority_document_id: {$ref: '#/components/schemas/Id'}
      responses:
        '202':
          description: Gate opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Gate'}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
